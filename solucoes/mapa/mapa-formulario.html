<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa — Formulário de Respondente | REVIZI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --roxo: #5415A3; --lilas: #A863FF; --dourado: #C89B4A;
    --bg1: #090414; --bg2: #150D27; --cinza: #CCCCCC; --branco: #FFFFFF;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: var(--bg1); color: var(--branco); font-family:'Inter',sans-serif; min-height:100vh; }
  .wrap { max-width: 600px; margin: 0 auto; padding: 32px 20px 60px; }
  .brand { text-align:center; margin-bottom:20px; }
  .brand-name { font-family:'Cormorant Garamond',serif; font-weight:700; font-size:22px; color:var(--dourado); }

  .progress-bar { height:5px; background:rgba(255,255,255,0.08); border-radius:3px; margin-bottom:8px; overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(90deg, var(--roxo), var(--dourado)); border-radius:3px; transition:width .3s ease; }
  .progress-label { font-size:11.5px; color:var(--cinza); text-align:center; margin-bottom:24px; }

  .card { background:var(--bg2); border-radius:16px; padding:28px 24px; border:1px solid rgba(200,155,74,0.15); }
  .step { display:none; }
  .step.active { display:block; }

  .dim-tag { font-size:10.5px; color:var(--lilas); font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:8px; }
  .pergunta-titulo { font-family:'Cormorant Garamond',serif; font-size:22px; color:var(--branco); margin-bottom:18px; line-height:1.3; }

  .opcao { display:block; background:var(--bg1); border:1.5px solid rgba(255,255,255,0.1); border-radius:12px; padding:14px 16px; margin-bottom:10px; cursor:pointer; transition:border-color .15s; }
  .opcao:hover { border-color:rgba(200,155,74,0.4); }
  .opcao input { display:none; }
  .opcao input:checked + .opcao-texto { color:var(--dourado); }
  .opcao.selecionada { border-color:var(--dourado); background:rgba(200,155,74,0.08); }
  .opcao-nota { display:inline-block; font-weight:700; color:var(--lilas); margin-right:8px; }
  .opcao-texto { font-size:13.5px; color:var(--branco); }

  .evidencia-box { margin-top:20px; padding-top:18px; border-top:1px solid rgba(255,255,255,0.08); }
  .evidencia-label { font-size:12px; color:var(--cinza); margin-bottom:10px; }
  .evidencia-opcoes { display:flex; flex-direction:column; gap:8px; }
  .evidencia-radio { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--branco); cursor:pointer; }
  textarea.evidencia-texto-livre { width:100%; margin-top:10px; background:var(--bg1); border:1.5px solid rgba(255,255,255,0.1); border-radius:10px; padding:10px 12px; color:var(--branco); font-family:'Inter'; font-size:13px; min-height:60px; resize:vertical; }

  input[type=text], input[type=email], input[type=tel] {
    width:100%; background:var(--bg1); border:1.5px solid rgba(255,255,255,0.1); border-radius:10px;
    padding:13px 14px; color:var(--branco); font-size:14px; margin-bottom:14px; font-family:'Inter';
  }
  label.campo-label { font-size:12px; color:var(--lilas); font-weight:600; margin-bottom:6px; display:block; }

  .nav-buttons { display:flex; justify-content:space-between; margin-top:24px; }
  .btn { background:var(--roxo); color:var(--branco); font-weight:700; font-size:14px; padding:13px 26px; border:none; border-radius:10px; cursor:pointer; }
  .btn-voltar { background:none; color:var(--cinza); font-size:13px; border:none; cursor:pointer; visibility:hidden; }

  .processando { text-align:center; padding:50px 20px; }
  .ampulheta { font-size:44px; animation: pulsar 1s ease-in-out infinite; display:inline-block; }
  @keyframes pulsar { 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.1); opacity:0.75; } }

  .confirmacao { text-align:center; padding:40px 20px; }
  .confirmacao h2 { font-family:'Cormorant Garamond',serif; color:var(--dourado); font-size:24px; margin-bottom:12px; }
  .confirmacao p { color:var(--cinza); font-size:14px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand"><div class="brand-name">REVIZI — Mapa</div></div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
  <div class="progress-label" id="progressLabel">Etapa 1 de 14</div>

  <div class="card">

    <!-- ETAPA 0 — Identificação do respondente -->
    <div class="step active" data-step="0">
      <div class="dim-tag">Identificação</div>
      <p class="pergunta-titulo">Antes de começar, quem está respondendo?</p>
      <label class="campo-label">Seu nome</label>
      <input type="text" id="respNome" placeholder="Nome completo">
      <label class="campo-label">Sua função na empresa</label>
      <input type="text" id="respFuncao" placeholder="Ex.: Sócio-Diretor, Gerente Comercial, Vendedor">
      <label class="campo-label">Nome da empresa</label>
      <input type="text" id="respEmpresa" placeholder="Razão social ou nome fantasia">
    </div>

    <!-- As 12 perguntas serão injetadas aqui via JS -->
    <div id="perguntasContainer"></div>

    <!-- ETAPA PROCESSANDO -->
    <div class="step" data-step="13">
      <div class="processando">
        <div class="ampulheta">⏳</div>
        <p id="msgProcessando" style="color:var(--cinza); margin-top:16px;">Registrando suas respostas...</p>
      </div>
    </div>

    <!-- ETAPA CONFIRMAÇÃO -->
    <div class="step" data-step="14">
      <div class="confirmacao">
        <h2>Respostas registradas</h2>
        <p>Obrigado por participar do Mapa. Assim que todos os respondentes concluírem, a REVIZI inicia a análise. O relatório é entregue em até 72h.</p>
      </div>
    </div>

    <div class="nav-buttons" id="navButtons">
      <button class="btn-voltar" id="btnVoltar">← Voltar</button>
      <button class="btn" id="btnAvancar">Avançar →</button>
    </div>

  </div>
</div>

<script>
  // ===== CONFIGURAÇÃO =====
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyhWdimekbaK2spCF2CfdYsyd8iVJKQSExgwM-wyk1jA14GV55-P4w9P2IppdM2NQzJtw/exec';
  const TOKEN_ESCRITA = 'Revizi-Escrita-2026'; // MESMO valor de TOKEN_ESCRITA no Apps Script -- troque os dois juntos por senha real

  // Lê parâmetros da URL — o sênior gera um link único por respondente
  const params = new URLSearchParams(window.location.search);
  const casoId = params.get('caso') || '';
  const respondenteNum = params.get('respondente') || '';

  // ===== AS 12 PERGUNTAS DA MATRIZ DIAGNÓSTICA v1.0 =====
  const PERGUNTAS = [
    { codigo: 'D1.3', dimensao: 'D1 · Estrutura de Oferta',
      texto: 'Pode mostrar o material comercial atual da empresa (apresentação, catálogo ou proposta-padrão)?',
      opcoes: [
        { nota: 0, texto: 'Não tenho material, ou o que existe contradiz o que oferecemos' },
        { nota: 5, texto: 'Existe material, mas está desatualizado ou incompleto' },
        { nota: 10, texto: 'Material atualizado e coerente com o que oferecemos hoje' },
      ], temEvidencia: true },
    { codigo: 'D1.1', dimensao: 'D1 · Estrutura de Oferta',
      texto: 'Como é definida a precificação e as condições comerciais?',
      opcoes: [
        { nota: 0, texto: 'Não existe política — cada negociação é decidida na hora' },
        { nota: 5, texto: 'Existe uma referência, mas descontos/exceções são muito livres' },
        { nota: 10, texto: 'Existe política formal, com preços, limites e alçadas definidos' },
      ], temEvidencia: true },
    { codigo: 'D2.1', dimensao: 'D2 · Tração Comercial',
      texto: 'Como a empresa capta novos clientes hoje?',
      opcoes: [
        { nota: 0, texto: 'Só por indicação espontânea, sem nenhuma ação estruturada' },
        { nota: 5, texto: 'Temos ações/canais ativos, mas de forma esporádica' },
        { nota: 10, texto: 'Temos mecanismo ativo e recorrente, com registro/indicadores' },
      ], temEvidencia: true },
    { codigo: 'D2.3', dimensao: 'D2 · Tração Comercial',
      texto: 'Como é feita a gestão de follow-up com clientes em negociação?',
      opcoes: [
        { nota: 0, texto: 'Fica na memória — muitas propostas somem sem retorno' },
        { nota: 5, texto: 'Fazemos, mas de forma reativa, sem prazo definido' },
        { nota: 10, texto: 'Temos rotina sistemática, com evidência de uso real' },
      ], temEvidencia: true },
    { codigo: 'D3.1', dimensao: 'D3 · Governança de Decisão',
      texto: 'Quais indicadores a diretoria utiliza para acompanhar o negócio?',
      opcoes: [
        { nota: 0, texto: 'Só saldo bancário e faturamento no fim do mês' },
        { nota: 5, texto: 'Existe relatório/dashboard, mas raramente é consultado' },
        { nota: 10, texto: 'Dashboard comercial, consultado regularmente' },
      ], temEvidencia: true },
    { codigo: 'D3.2', dimensao: 'D3 · Governança de Decisão',
      texto: 'Qual o grau de dependência da venda em relação ao dono da empresa?',
      opcoes: [
        { nota: 0, texto: 'O dono precisa estar presente na maioria dos fechamentos' },
        { nota: 5, texto: 'A equipe conduz o dia a dia, mas o dono entra em negócios grandes' },
        { nota: 10, texto: 'A equipe tem autonomia definida para fechar dentro de alçadas' },
      ], temEvidencia: false },
    { codigo: 'D4.1', dimensao: 'D4 · Presença Digital',
      texto: 'Qual o estado da presença institucional digital da empresa (Google, site, redes)?',
      opcoes: [
        { nota: 0, texto: 'Inexistente, ou muito desatualizada' },
        { nota: 5, texto: 'Existe e é localizável, mas incompleta ou inconsistente' },
        { nota: 10, texto: 'Localizável, atualizada, completa e coerente' },
      ], temEvidencia: true },
    { codigo: 'D4.2', dimensao: 'D4 · Presença Digital',
      texto: 'As plataformas digitais têm mecanismo estruturado de captura de contato (formulário, botão)?',
      opcoes: [
        { nota: 0, texto: 'Não existe nenhum mecanismo identificável' },
        { nota: 5, texto: 'Existe, mas sem rastreabilidade da origem do contato' },
        { nota: 10, texto: 'Existe mecanismo estruturado, com rastreabilidade' },
      ], temEvidencia: true },
    { codigo: 'D5.1', dimensao: 'D5 · Capacidade de Conversão',
      texto: 'Onde e como é feita a gestão das oportunidades em andamento?',
      opcoes: [
        { nota: 0, texto: 'Dispersas em registros individuais, sem controle central' },
        { nota: 5, texto: 'Existe registro central, mas atualização é inconsistente' },
        { nota: 10, texto: 'Registro central, com evidência de atualização regular' },
      ], temEvidencia: true },
    { codigo: 'D5.2', dimensao: 'D5 · Capacidade de Conversão',
      texto: 'Como é estruturado o atendimento comercial via WhatsApp/mensagens?',
      opcoes: [
        { nota: 0, texto: 'Depende de número pessoal de cada vendedor' },
        { nota: 5, texto: 'Temos canal corporativo, mas com pouco histórico/rastreio' },
        { nota: 10, texto: 'Ambiente corporativo, com histórico e rastreabilidade' },
      ], temEvidencia: true },
    { codigo: 'D6.1', dimensao: 'D6 · Maturidade de Dado',
      texto: 'Você consegue extrair, hoje, um relatório de vendas/clientes por canal?',
      opcoes: [
        { nota: 0, texto: 'Não existe fonte que informe isso' },
        { nota: 5, texto: 'O dado existe, mas exige busca/consolidação manual' },
        { nota: 10, texto: 'O dado é centralizado e extraível facilmente' },
      ], temEvidencia: true },
    { codigo: 'D6.2', dimensao: 'D6 · Maturidade de Dado',
      texto: 'O que está registrado no sistema bate com o que os responsáveis relatam de memória?',
      opcoes: [
        { nota: 0, texto: 'Existe divergência real entre o registro e os relatos' },
        { nota: 5, texto: 'Existe diferença parcial, que exige reconciliação' },
        { nota: 10, texto: 'Registro e relatos batem, na mesma métrica e período' },
      ], temEvidencia: true },
  ];

  // ===== Monta o HTML das 12 perguntas dinamicamente =====
  const container = document.getElementById('perguntasContainer');
  PERGUNTAS.forEach((p, idx) => {
    const stepNum = idx + 1;
    const div = document.createElement('div');
    div.className = 'step';
    div.dataset.step = stepNum;

    let opcoesHtml = p.opcoes.map(o => `
      <label class="opcao" data-nota="${o.nota}">
        <input type="radio" name="resposta_${p.codigo}" value="${o.nota}">
        <span class="opcao-texto"><span class="opcao-nota">${o.nota}</span>${o.texto}</span>
      </label>
    `).join('');

    let evidenciaHtml = '';
    if (p.temEvidencia) {
      evidenciaHtml = `
        <div class="evidencia-box">
          <div class="evidencia-label">Sobre a evidência desta pergunta:</div>
          <div class="evidencia-opcoes">
            <label class="evidencia-radio"><input type="radio" name="evidencia_${p.codigo}" value="Apresentada"> Vou anexar/descrever a evidência abaixo</label>
            <label class="evidencia-radio"><input type="radio" name="evidencia_${p.codigo}" value="Inexistência declarada"> Declaro que isso não existe na empresa</label>
            <label class="evidencia-radio"><input type="radio" name="evidencia_${p.codigo}" value="Não apresentada"> Prefiro não apresentar agora</label>
          </div>
          <textarea class="evidencia-texto-livre" id="evidenciaTexto_${p.codigo}" placeholder="Descreva a evidência (ex.: nome do documento, o que ele mostra) — ou cole um link, se for material online"></textarea>
        </div>
      `;
    }

    div.innerHTML = `
      <div class="dim-tag">${p.dimensao}</div>
      <p class="pergunta-titulo">${p.texto}</p>
      ${opcoesHtml}
      ${evidenciaHtml}
    `;
    container.appendChild(div);
  });

  // ===== Navegação do wizard =====
  const totalSteps = 15; // 0 (identificação) + 12 perguntas + processando + confirmação
  let current = 0;
  const steps = document.querySelectorAll('.step');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const btnVoltar = document.getElementById('btnVoltar');
  const btnAvancar = document.getElementById('btnAvancar');
  const navButtons = document.getElementById('navButtons');

  // Marca visualmente a opção selecionada
  container.addEventListener('click', (e) => {
    const opcao = e.target.closest('.opcao');
    if (!opcao) return;
    const grupo = opcao.closest('.step').querySelectorAll('.opcao');
    grupo.forEach(o => o.classList.remove('selecionada'));
    opcao.classList.add('selecionada');
    opcao.querySelector('input').checked = true;
  });

  function showStep(i) {
    steps.forEach(s => s.classList.remove('active'));
    const alvo = document.querySelector(`.step[data-step="${i}"]`);
    if (alvo) alvo.classList.add('active');

    progressFill.style.width = `${(i/(totalSteps-1))*100}%`;

    if (i === 0) {
      progressLabel.textContent = 'Identificação';
      btnVoltar.style.visibility = 'hidden';
      navButtons.style.display = 'flex';
    } else if (i >= 1 && i <= 12) {
      progressLabel.textContent = `Pergunta ${i} de 12`;
      btnVoltar.style.visibility = 'visible';
      navButtons.style.display = 'flex';
      btnAvancar.textContent = i === 12 ? 'Concluir →' : 'Avançar →';
    } else if (i === 13) {
      navButtons.style.display = 'none';
      enviarRespostas();
    } else if (i === 14) {
      navButtons.style.display = 'none';
    }
  }

  btnAvancar.addEventListener('click', () => {
    if (current < totalSteps - 1) { current++; showStep(current); }
  });
  btnVoltar.addEventListener('click', () => {
    if (current > 0) { current--; showStep(current); }
  });

  function coletarRespostas() {
    const dados = {
      token: TOKEN_ESCRITA,
      acao: 'salvarRespostaMapa',
      casoId: casoId,
      respondenteNum: respondenteNum,
      respNome: document.getElementById('respNome').value,
      respFuncao: document.getElementById('respFuncao').value,
      respEmpresa: document.getElementById('respEmpresa').value,
      respostas: {},
    };
    PERGUNTAS.forEach(p => {
      const respostaEl = document.querySelector(`input[name="resposta_${p.codigo}"]:checked`);
      const evidenciaEl = document.querySelector(`input[name="evidencia_${p.codigo}"]:checked`);
      const evidenciaTextoEl = document.getElementById(`evidenciaTexto_${p.codigo}`);
      dados.respostas[p.codigo] = {
        nota: respostaEl ? parseInt(respostaEl.value) : null,
        estadoEvidencia: evidenciaEl ? evidenciaEl.value : (p.temEvidencia ? 'Não apresentada' : 'Não aplicável por desenho'),
        evidenciaTexto: evidenciaTextoEl ? evidenciaTextoEl.value : '',
      };
    });
    return dados;
  }

  function enviarRespostas() {
    const dados = coletarRespostas();
    const msgs = ['Registrando suas respostas...', 'Confirmando evidências...', 'Preparando para os demais respondentes...'];
    let idx = 0;
    const msgEl = document.getElementById('msgProcessando');
    const intervalo = setInterval(() => { idx++; if (idx < msgs.length) msgEl.textContent = msgs[idx]; }, 1000);

    fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(dados) })
      .catch(err => console.error('Falha ao enviar (dado local não é perdido, mas não foi sincronizado):', err))
      .finally(() => {
        setTimeout(() => { clearInterval(intervalo); current = 14; showStep(14); }, 3500);
      });
  }

  showStep(0);
</script>
</body>
</html>
