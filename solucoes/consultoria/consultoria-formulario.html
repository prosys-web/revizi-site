<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Solicitar análise — Consultoria REVIZI</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--d:#C89B4A;--r:#5415A3;--b1:#090414;--b2:#150D27;--c:#ccc}*{box-sizing:border-box}body{margin:0;background:var(--b1);color:#fff;font-family:Inter,sans-serif}.wrap{max-width:650px;margin:auto;padding:40px 22px 70px}.brand{text-align:center;color:var(--d);font:700 28px 'Cormorant Garamond',serif}h1{font:700 32px 'Cormorant Garamond',serif;text-align:center}p{color:var(--c);font-size:13px;line-height:1.6}.field{margin:14px 0}label{display:block;color:var(--d);font-size:12px;margin-bottom:5px}input,textarea{width:100%;background:var(--b2);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:12px;color:#fff}textarea{min-height:130px;resize:vertical}button{width:100%;background:var(--r);color:#fff;border:0;border-radius:9px;padding:14px;font-weight:700;cursor:pointer}.status{text-align:center;margin-top:14px;font-size:12px}.err{color:#ff8d88}.ok{display:none;background:var(--b2);border:1px solid var(--d);border-radius:12px;padding:22px;text-align:center;margin-top:20px}a{color:var(--d)}</style></head><body><div class="wrap"><div class="brand">REVIZI</div><h1>Solicitar análise de Consultoria</h1><p>Conte brevemente o contexto. A REVIZI utiliza esta solicitação para avaliar o próximo passo — sem contratação automática.</p><form id="f"><div class="field"><label>Nome</label><input id="nome" required></div><div class="field"><label>Empresa</label><input id="empresa" required></div><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>WhatsApp</label><input id="whatsapp" required></div><div class="field"><label>Contexto</label><textarea id="contexto" required placeholder="Descreva o momento comercial da empresa e o que deseja estruturar."></textarea></div><button id="btn">Enviar solicitação</button><div id="msg" class="status"></div></form><div id="ok" class="ok"><h2>Solicitação recebida</h2><p>Registramos seus dados com sucesso. A equipe REVIZI entrará em contato.</p><p><a href="index.html">Voltar para Consultoria</a></p></div></div><script>
const API='https://script.google.com/macros/s/AKfycbyhWdimekbaK2spCF2CfdYsyd8iVJKQSExgwM-wyk1jA14GV55-P4w9P2IppdM2NQzJtw/exec';f.onsubmit=async e=>{e.preventDefault();btn.disabled=true;msg.className='status';msg.textContent='Enviando...';const dados={acao:'submeterConsultoria',nome:nome.value.trim(),empresa:empresa.value.trim(),email:email.value.trim(),whatsapp:whatsapp.value.trim(),observacoes:contexto.value.trim()};try{const r=await fetch(API,{method:'POST',body:JSON.stringify(dados)});if(!r.ok)throw new Error('Falha HTTP');const j=await r.json();if(j.status!=='ok')throw new Error(j.mensagem||'Falha');f.style.display='none';ok.style.display='block'}catch(x){msg.className='status err';msg.textContent=x.message||'Não foi possível enviar. Tente novamente.';btn.disabled=false}};
</script></body></html>
