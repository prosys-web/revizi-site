<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento Confirmado | REVIZI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --dourado:#C89B4A; --bg1:#090414; --bg2:#150D27; --cinza:#CCCCCC; --branco:#FFFFFF; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg1); color:var(--branco); font-family:'Inter',sans-serif; line-height:1.6; display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:30px; }
  .box { max-width:420px; }
  .check { font-size:44px; margin-bottom:16px; }
  .brand { font-family:'Cormorant Garamond',serif; font-weight:700; font-size:20px; color:var(--dourado); margin-bottom:20px; }
  .h1 { font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:700; margin-bottom:14px; }
  .texto { font-size:14px; color:var(--cinza); line-height:1.6; }
</style>
</head>
<body>
<div class="box">
  <div class="check">✅</div>
  <div class="brand">REVIZI</div>
  <div class="h1">Pagamento recebido</div>
  <p class="texto">Assim que a confirmação do pagamento for processada, você recebe por e-mail o link de acesso ao seu ambiente. Isso costuma levar alguns instantes — se não chegar em até 10 minutos, fale com a gente pelo WhatsApp.</p>
</div>
</body>
</html>
