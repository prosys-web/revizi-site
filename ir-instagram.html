<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecionando...</title>
<style>
  body { background:#090414; color:#FFFFFF; font-family:Arial,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; }
  .msg { font-size:14px; color:#CCCCCC; }
</style>
</head>
<body>
<div class="msg">Redirecionando para o Instagram da REVIZI...</div>

<script>
  // ATENÇÃO: substituir pela URL real do Instagram da REVIZI assim que existir
  const INSTAGRAM_URL = 'https://www.instagram.com/revizi.ofc';

  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyhWdimekbaK2spCF2CfdYsyd8iVJKQSExgwM-wyk1jA14GV55-P4w9P2IppdM2NQzJtw/exec';
  const TOKEN_ESCRITA = 'Revizi-Escrita-2026'; // MESMO valor de TOKEN_ESCRITA no Apps Script -- troque os dois juntos por senha real

  const params = new URLSearchParams(window.location.search);
  const origem = params.get('origem') || 'direto';
  const parceria = params.get('parceria') || '';

  // Dispara o registro do clique, sem esperar resposta (não atrasa o redirecionamento)
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({
      token: TOKEN_ESCRITA,
      acao: 'registrarEvento',
      tipoEvento: 'Clique Instagram',
      origem: origem,
      parceria: parceria,
    }),
  }).catch(err => console.error('Falha ao registrar clique (redirecionamento acontece de qualquer forma):', err));

  // Redireciona imediatamente — não espera a confirmação do registro
  window.location.href = INSTAGRAM_URL;
</script>
</body>
</html>
